<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saffron Café</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2a1a12; --cream:#fbf4ea; --saf:#e8772e; --rose:#f2c7b5; --muted:#7a6457; }
  *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--ink)}
  a{color:inherit;text-decoration:none} button{font:inherit;cursor:pointer;border:0}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px 5vw;background:rgba(251,244,234,.85);backdrop-filter:blur(10px)}
  .logo{font-family:Fraunces,serif;font-size:24px;font-weight:700} .logo span{color:var(--saf)}
  nav{display:flex;gap:26px;font-size:15px;color:var(--muted)} nav a:hover{color:var(--ink)}
  .cart-btn{position:relative;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600}
  .cart-btn b{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--saf);font-size:12px;display:grid;place-items:center;transition:transform .3s}
  .cart-btn b.bump{transform:scale(1.35)}
  .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:60px 5vw 40px}
  h1{font-family:Fraunces,serif;font-size:clamp(40px,6vw,76px);line-height:1.02;margin:0 0 18px}
  h1 em{color:var(--saf);font-style:italic}
  .hero p{color:var(--muted);font-size:18px;max-width:440px;line-height:1.6}
  .cta{display:inline-block;margin-top:24px;background:var(--saf);color:#fff;padding:15px 28px;border-radius:999px;font-weight:600;box-shadow:0 12px 30px -10px var(--saf)}
  .cup{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 45%,#6b3b22 0 30%,#d9a37a 31% 36%,#fff 37% 52%,var(--rose) 53%);position:relative;box-shadow:0 40px 80px -30px rgba(80,30,10,.5)}
  .cup::after{content:"";position:absolute;left:50%;top:6%;width:2px;height:18%;background:linear-gradient(transparent,rgba(255,255,255,.8));animation:steam 3s infinite}
  @keyframes steam{50%{transform:translateY(-12px) scaleY(1.3);opacity:.4}}
  .tabs{display:flex;gap:10px;padding:10px 5vw 24px;flex-wrap:wrap}
  .tab{padding:10px 18px;border-radius:999px;background:#fff;color:var(--muted);font-weight:600;border:1px solid #eadccd}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:0 5vw 70px}
  .item{background:#fff;border-radius:22px;padding:18px;border:1px solid #f0e4d6;transition:transform .3s}
  .item:hover{transform:translateY(-4px)}
  .pic{height:130px;border-radius:16px;margin-bottom:14px;display:grid;place-items:center;font-size:52px}
  .item h3{margin:0 0 4px;font-family:Fraunces,serif;font-size:20px} .item p{margin:0;color:var(--muted);font-size:14px}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
  .row b{font-size:18px} .add{background:var(--cream);color:var(--ink);padding:9px 14px;border-radius:12px;font-weight:600}
  .add:hover{background:var(--saf);color:#fff}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;box-shadow:-20px 0 60px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:10;display:flex;flex-direction:column;padding:24px}
  .drawer.open{transform:none} .drawer h2{font-family:Fraunces,serif;margin:0 0 16px}
  .lines{flex:1;overflow:auto} .line{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f2e8dc}
  .total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin:18px 0}
  .close{position:absolute;top:18px;right:20px;background:none;font-size:22px}
  .empty{color:var(--muted)}
  @media(max-width:720px){.hero{grid-template-columns:1fr}.cup{max-width:260px;margin:auto}nav{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">Saffron<span>.</span></div>
  <nav><a href="#menu">Menu</a><a href="#menu">Beans</a><a href="#menu">Visit</a></nav>
  <button class="cart-btn" id="cartBtn">Cart <b id="count">0</b></button>
</header>
<section class="hero">
  <div>
    <h1>Slow coffee,<br><em>golden</em> moments.</h1>
    <p>Single‑origin beans, hand‑poured with a hint of saffron. Order ahead and skip the line.</p>
    <a class="cta" href="#menu">Order now</a>
  </div>
  <div class="cup"></div>
</section>
<div class="tabs" id="tabs"></div>
<section class="menu" id="menu"></section>
<aside class="drawer" id="drawer">
  <button class="close" id="close">✕</button>
  <h2>Your order</h2>
  <div class="lines" id="lines"></div>
  <div class="total"><span>Total</span><span id="total">$0.00</span></div>
  <button class="cta" style="border:0;width:100%" onclick="alert('Demo checkout ✨')">Checkout</button>
</aside>
<script>
const items=[
 {n:"Saffron Latte",d:"Espresso, oat milk, saffron syrup",p:5.5,c:"Coffee",e:"☕",bg:"#f8e1cf"},
 {n:"Pour Over",d:"Ethiopia Yirgacheffe, floral",p:4.8,c:"Coffee",e:"🫖",bg:"#efe2d2"},
 {n:"Cold Brew",d:"18‑hour steep, citrus notes",p:4.5,c:"Coffee",e:"🧊",bg:"#dfe8ef"},
 {n:"Rose Matcha",d:"Ceremonial matcha, rose water",p:5.9,c:"Tea",e:"🍵",bg:"#e3efd9"},
 {n:"Chai Spice",d:"House masala, honey",p:4.6,c:"Tea",e:"🌿",bg:"#f3e6cf"},
 {n:"Pistachio Croissant",d:"Baked every morning",p:4.2,c:"Bakery",e:"🥐",bg:"#f6ead2"},
 {n:"Date Cake",d:"Cardamom, walnut",p:3.9,c:"Bakery",e:"🍰",bg:"#f5dcd8"},
];
const cats=["All",...new Set(items.map(i=>i.c))];let cat="All";const cart={};
const $=s=>document.querySelector(s);
function tabs(){$("#tabs").innerHTML=cats.map(c=>`<button class="tab ${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("")}
function menu(){$("#menu").innerHTML=items.map((it,i)=>cat!=="All"&&it.c!==cat?"":`<div class="item"><div class="pic" style="background:${it.bg}">${it.e}</div><h3>${it.n}</h3><p>${it.d}</p><div class="row"><b>$${it.p.toFixed(2)}</b><button class="add" data-i="${i}">+ Add</button></div></div>`).join("")}
function draw(){const ks=Object.keys(cart);let tot=0,n=0;$("#lines").innerHTML=ks.length?ks.map(k=>{const it=items[k];tot+=it.p*cart[k];n+=cart[k];return`<div class="line"><span>${cart[k]} × ${it.n}</span><b>$${(it.p*cart[k]).toFixed(2)}</b></div>`}).join(""):'<p class="empty">Your cart is empty.</p>';$("#total").textContent="$"+tot.toFixed(2);const c=$("#count");c.textContent=n;c.classList.add("bump");setTimeout(()=>c.classList.remove("bump"),250)}
$("#tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;cat=b.dataset.c;tabs();menu()};
$("#menu").onclick=e=>{const b=e.target.closest(".add");if(!b)return;cart[b.dataset.i]=(cart[b.dataset.i]||0)+1;draw()};
$("#cartBtn").onclick=()=>$("#drawer").classList.add("open");$("#close").onclick=()=>$("#drawer").classList.remove("open");
tabs();menu();draw();
</script>
</body>
</html>
