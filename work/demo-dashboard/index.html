<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0d17;--panel:#131628;--line:#22263f;--text:#eef0ff;--muted:#8d92b5;--a:#6d7bff;--b:#22d3ee;--ok:#34d399}
  *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
  button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
  aside{width:230px;flex:none;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:6px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin:0 8px 24px}
  .brand i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--a),var(--b))}
  .nav{padding:10px 12px;border-radius:10px;color:var(--muted);text-align:left;font-weight:500}
  .nav.on,.nav:hover{background:var(--panel);color:var(--text)}
  main{flex:1;padding:28px 32px;min-width:0}
  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  h1{margin:0;font-size:24px} .top p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
  .seg button{padding:8px 14px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13px}.seg .on{background:#262b4a;color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
  .kpi span{color:var(--muted);font-size:13px}.kpi b{display:block;font-size:26px;margin:8px 0 4px}.kpi em{font-style:normal;color:var(--ok);font-size:13px;font-weight:600}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;position:relative}
  .card h2{margin:0 0 14px;font-size:15px}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .tip{position:absolute;pointer-events:none;background:#fff;color:#111;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;transform:translate(-50%,-130%);opacity:0;transition:opacity .15s;white-space:nowrap}
  .src{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .bar{height:6px;border-radius:3px;background:#262b4a;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .8s}
  @media(max-width:900px){aside{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}main{padding:20px}}
</style>
</head>
<body>
<aside>
  <div class="brand"><i></i>Pulse</div>
  <button class="nav on">Overview</button><button class="nav">Audience</button><button class="nav">Revenue</button><button class="nav">Campaigns</button><button class="nav">Settings</button>
</aside>
<main>
  <div class="top">
    <div><h1>Overview</h1><p>Welcome back — here's what's happening.</p></div>
    <div class="seg" id="seg"><button data-r="7">7D</button><button data-r="30" class="on">30D</button><button data-r="90">90D</button></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div class="card"><h2>Revenue</h2><svg id="chart" viewBox="0 0 600 240"></svg><div class="tip" id="tip"></div></div>
    <div class="card"><h2>Traffic sources</h2><div id="srcs"></div></div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
function rnd(seed){return()=>((seed=Math.imul(seed^seed>>>15,seed|1)+0x6d2b79f5|0)>>>0)/4294967296}
function render(r){
  const R=rnd(r*97);const pts=Array.from({length:r>30?45:r},(_,i)=>2000+i*40+R()*900);
  const tot=pts.reduce((a,b)=>a+b,0);
  const k=[["Revenue","$"+Math.round(tot).toLocaleString(),"+"+(8+R()*10).toFixed(1)+"%"],["Users",Math.round(tot/3).toLocaleString(),"+"+(4+R()*8).toFixed(1)+"%"],["Conversion",(2+R()*2).toFixed(2)+"%","+"+(R()*2).toFixed(1)+"%"],["Avg. order","$"+(40+R()*30).toFixed(0),"+"+(R()*5).toFixed(1)+"%"]];
  $("#kpis").innerHTML=k.map(([a,b,c])=>`<div class="kpi"><span>${a}</span><b>${b}</b><em>${c}</em></div>`).join("");
  const W=600,H=220,max=Math.max(...pts)*1.1,step=W/(pts.length-1);
  const xy=pts.map((v,i)=>[i*step,H-v/max*H]);
  const d=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  $("#chart").innerHTML=`<defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6d7bff" stop-opacity=".45"/><stop offset="1" stop-color="#6d7bff" stop-opacity="0"/></linearGradient><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#6d7bff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
  ${[0,1,2,3].map(i=>`<line x1="0" x2="${W}" y1="${i*H/3}" y2="${i*H/3}" stroke="#22263f"/>`).join("")}
  <path d="${d} L${W} ${H} L0 ${H}Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="url(#l)" stroke-width="3" stroke-linejoin="round"/>
  <circle id="dot" r="6" fill="#fff" stroke="#6d7bff" stroke-width="3" opacity="0"/>
  <rect width="${W}" height="${H}" fill="transparent" id="hit"/>`;
  const svg=$("#chart"),tip=$("#tip"),dot=$("#dot");
  $("#hit").onmousemove=e=>{const b=svg.getBoundingClientRect();const x=(e.clientX-b.left)/b.width*W;const i=Math.max(0,Math.min(pts.length-1,Math.round(x/step)));const [px,py]=xy[i];dot.setAttribute("cx",px);dot.setAttribute("cy",py);dot.setAttribute("opacity",1);tip.style.opacity=1;tip.style.left=(20+px/W*b.width)+"px";tip.style.top=(52+py/W*b.width)+"px";tip.textContent="Day "+(i+1)+" · $"+Math.round(pts[i]).toLocaleString()};
  $("#hit").onmouseleave=()=>{tip.style.opacity=0;dot.setAttribute("opacity",0)};
  const s=[["Organic search",R()],["Instagram",R()],["Direct",R()],["YouTube",R()],["Referral",R()]];const sm=s.reduce((a,b)=>a+b[1],0);
  $("#srcs").innerHTML=s.map(([n,v])=>`<div class="src"><div style="flex:1"><div>${n}</div><div class="bar"><i style="width:0" data-w="${v/sm*100*2.2}"></i></div></div><b style="margin-left:14px">${(v/sm*100).toFixed(0)}%</b></div>`).join("");
  requestAnimationFrame(()=>document.querySelectorAll(".bar i").forEach(i=>i.style.width=Math.min(100,i.dataset.w)+"%"));
}
$("#seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b));render(+b.dataset.r)};
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("on",x===n))});
render(30);
</script>
</body>
</html>
